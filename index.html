<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GAME START!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:Arial,"Malgun Gothic",sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
#hud{position:fixed;z-index:20;top:12px;left:0;width:100%;padding:8px 16px;display:flex;justify-content:space-between;font-size:22px;font-weight:bold;color:#222;text-shadow:1px 1px white,-1px -1px white;pointer-events:none}
#stage{position:fixed;z-index:20;top:52px;left:50%;transform:translateX(-50%);color:#ff2870;font-weight:bold;font-size:18px;text-shadow:1px 1px white,-1px -1px white;pointer-events:none}
.screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,#ffd6e5,#fff4fa,#d7e9ff)}
#gameOver{display:none;background:rgba(20,10,35,.88);color:white}
.logo{font-size:clamp(42px,10vw,82px);color:#ff1761;font-weight:900;text-shadow:-3px -3px white,3px -3px white,-3px 3px white,3px 3px white,7px 7px 0 rgba(100,30,70,.2);margin-bottom:18px}
.hero{height:clamp(90px,18vh,150px);image-rendering:pixelated;margin-bottom:14px;animation:bob 0.9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sub{font-size:clamp(16px,4vw,24px);color:#63334b;margin-bottom:24px}
button{border:4px solid white;border-radius:18px;padding:14px 32px;margin:7px;min-width:180px;font-size:clamp(19px,5vw,28px);font-weight:bold;color:white;background:#ff4d86;box-shadow:0 6px 0 #a92758;cursor:pointer}
button:active{transform:translateY(6px);box-shadow:none}
#stopBtn{background:#555;box-shadow:0 6px 0 #222}
.instructions{margin-top:22px;color:#555;line-height:1.7;font-size:15px}
#scoreFinal{font-size:28px;margin:10px 0 18px}#newRecord{color:#ffcf33;font-size:22px;margin-bottom:10px}
#blogMsg{font-size:clamp(16px,4vw,22px);line-height:1.5;margin-bottom:10px;color:#fff}
#blogBtn{background:#2f80ff;box-shadow:0 6px 0 #1a4fb0;animation:pulse 1.2s ease-in-out infinite}
#blogBtn:active{animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.btnRow{display:flex;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div>SCORE : <span id="score">0</span></div><div><span id="hearts"></span></div></div>
<div id="stage"></div>
<div id="startScreen" class="screen">
  <div class="logo">GAME START!</div>
  <img class="hero" src="player.png" alt="" onerror="this.style.display='none'">
  <div class="sub">귀여운 캐릭터의 장애물 피하기 게임</div>
  <button id="startBtn">게임 시작</button>
  <div class="instructions">PC : SPACE / ↑ / W 로 점프<br>스마트폰 : 화면을 터치해서 점프<br>1초마다 10점씩 올라가요!<br>시간이 갈수록 점점 빨라집니다!</div>
</div>
<div id="gameOver" class="screen">
  <div class="logo">GAME OVER</div><div id="newRecord"></div>
  <div id="scoreFinal">최종 점수 : 0</div>
  <div id="blogMsg">장애물에 3번 닿았어요! 😆<br>김세희님의 졸업작품을 보러 가볼까요?</div>
  <button id="blogBtn">블로그 입장</button>
  <div class="btnRow"><button id="restartBtn">다시하기</button><button id="stopBtn">그만하기</button></div>
</div>
<script>
'use strict';
const BLOG_URL='https://m.blog.naver.com/o2278/224430302251';
const POINTS_PER_SECOND=10; // 1초당 올라가는 점수
const START_SPEED=9;        // 시작 속도
const MAX_SPEED=19;         // 최고 속도
const PLAYER_IMG='player.png'; // 주인공 이미지 파일 이름
const PLAYER_HEIGHT=90;        // 주인공 키(픽셀)

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0,ground=0,DPR=1;
let gameRunning=false,score=0,lives=3,speed=START_SPEED,stage=1,frame=0,spawnTimer=0,lastTime=0,messageTimer=0;
let animationId=0;
let bestScore=0;
try{bestScore=Number(localStorage.getItem('cuteGameBest')||0)}catch(e){bestScore=0}

/* ===== 주인공 이미지 불러오기 + 흰 배경 제거 + 여백 자르기 ===== */
let sprite=null;
function prepareSprite(img){
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
 const g=c.getContext('2d');g.drawImage(img,0,0);
 try{
  const w=c.width,h=c.height,d=g.getImageData(0,0,w,h),p=d.data;
  const isBg=i=>p[i+3]<20||(p[i]>232&&p[i+1]>232&&p[i+2]>232);
  const seen=new Uint8Array(w*h),stack=[];
  for(let x=0;x<w;x++)stack.push(x,(h-1)*w+x);
  for(let y=0;y<h;y++)stack.push(y*w,y*w+w-1);
  while(stack.length){
   const k=stack.pop();if(seen[k])continue;seen[k]=1;
   const i=k*4;if(!isBg(i))continue;p[i+3]=0;
   const x=k%w,y=(k-x)/w;
   if(x>0)stack.push(k-1);if(x<w-1)stack.push(k+1);if(y>0)stack.push(k-w);if(y<h-1)stack.push(k+w);
  }
  g.putImageData(d,0,0);
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(p[(y*w+x)*4+3]>20){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
  if(maxX>=0){
   const out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;
   out.getContext('2d').drawImage(c,minX,minY,out.width,out.height,0,0,out.width,out.height);
   return out;
  }
 }catch(e){}
 return c;
}
const playerImg=new Image();
playerImg.onload=()=>{
 sprite=prepareSprite(playerImg);
 player.h=PLAYER_HEIGHT;
 player.w=Math.round(PLAYER_HEIGHT*sprite.width/sprite.height);
 if(!gameRunning){player.y=ground-player.h;draw()}
};
playerImg.src=PLAYER_IMG;

/* 이미지를 못 찾았을 때 나오는 비슷한 도트 캐릭터 */
function drawFallback(x,y,w,h){
 const s=h/45,R=(c,a,b,ww,hh)=>{ctx.fillStyle=c;ctx.fillRect(x+a*s,y+b*s,ww*s,hh*s)};
 R('#222',2,26,3,12);R('#222',3,24,5,3);          // 꼬리
 R('#1d1d1d',7,15,13,15);                         // 검은 코트
 R('#ffffff',13,15,4,3);R('#c0202a',14,17,2,6);    // 셔츠, 빨간 넥타이
 R('#ffe0cc',8,4,12,11);                          // 얼굴
 R('#f3d88a',7,1,14,5);R('#f3d88a',7,5,4,9);R('#f3d88a',17,5,3,2); // 금발
 R('#c03a6a',16,9,2,2);R('#ffb3c1',17,12,2,1);    // 눈, 볼
 R('#666',9,30,4,9);R('#666',15,30,4,9);          // 바지
 R('#111',8,38,6,7);R('#111',15,38,7,7);          // 부츠
}

const player={
 x:80,y:0,w:48,h:PLAYER_HEIGHT,vy:0,gravity:.82,jumpPower:-15,onGround:true,invincible:0,
 update(dt){this.vy+=this.gravity*dt;this.y+=this.vy*dt;const floor=ground-this.h;if(this.y>=floor){this.y=floor;this.vy=0;this.onGround=true}else this.onGround=false;if(this.invincible>0)this.invincible=Math.max(0,this.invincible-dt)},
 jump(){if(this.onGround){this.vy=this.jumpPower;this.onGround=false}},
 draw(){
  if(this.invincible>0&&Math.floor(this.invincible/5)%2===0)return;
  const bob=(gameRunning&&this.onGround)?-Math.abs(Math.sin(frame*.25))*3:0;
  if(sprite){
   ctx.imageSmoothingEnabled=false;
   ctx.drawImage(sprite,this.x,this.y+bob,this.w,this.h);
   ctx.imageSmoothingEnabled=true;
  }else drawFallback(this.x,this.y+bob,this.w,this.h);
 }
};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);ground=H*.8;if(!gameRunning){player.y=ground-player.h;player.onGround=true}draw()}
window.addEventListener('resize',resize);

let obstacles=[],particles=[];
function makeObstacle(){const flying=Math.random()<.32,type=Math.floor(Math.random()*3),size=42+Math.random()*18;const y=flying?ground-105-Math.random()*150:ground-size;obstacles.push({x:W+50,y,w:size,h:size,type,flying,wave:Math.random()*Math.PI*2,passed:false})}
function drawObstacle(o){const {x,y,w,h}=o;
 if(o.type===0){ctx.fillStyle='#ff507d';ctx.beginPath();ctx.moveTo(x+w*.5,y+h*.45);ctx.lineTo(x+w*.05,y+h*.05);ctx.lineTo(x+w*.02,y+h*.7);ctx.lineTo(x+w*.45,y+h*.65);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(x+w*.5,y+h*.45);ctx.lineTo(x+w*.95,y+h*.05);ctx.lineTo(x+w*.98,y+h*.7);ctx.lineTo(x+w*.55,y+h*.65);ctx.closePath();ctx.fill();ctx.fillStyle='#ff315f';ctx.beginPath();ctx.arc(x+w*.5,y+h*.5,w*.17,0,Math.PI*2);ctx.fill()}
 else if(o.type===1){ctx.fillStyle='#e99483';ctx.beginPath();ctx.arc(x+w*.25,y+h*.2,w*.22,0,Math.PI*2);ctx.arc(x+w*.75,y+h*.2,w*.22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f39f91';ctx.beginPath();ctx.arc(x+w*.5,y+h*.55,w*.43,0,Math.PI*2);ctx.fill();face(x,y,w,h)}
 else{ctx.fillStyle='#66cbe0';ctx.beginPath();ctx.arc(x+w*.5,y+h*.55,w*.38,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x+w*.25,y+h*.3);ctx.lineTo(x+w*.1,y);ctx.lineTo(x+w*.35,y+h*.2);ctx.closePath();ctx.moveTo(x+w*.75,y+h*.3);ctx.lineTo(x+w*.9,y);ctx.lineTo(x+w*.65,y+h*.2);ctx.closePath();ctx.fill();face(x,y,w,h)}
}
function face(x,y,w,h){ctx.fillStyle='#333';ctx.beginPath();ctx.arc(x+w*.4,y+h*.5,2.5,0,Math.PI*2);ctx.arc(x+w*.6,y+h*.5,2.5,0,Math.PI*2);ctx.fill()}
function hit(a,b){const m=8;return a.x+m<b.x+b.w-m&&a.x+a.w-m>b.x+m&&a.y+m<b.y+b.h-m&&a.y+a.h-m>b.y+m}
function checkCollision(){if(player.invincible>0)return;for(let i=0;i<obstacles.length;i++){if(hit(player,obstacles[i])){lives--;player.invincible=100;obstacles.splice(i,1);updateHearts();explosion(player.x+player.w/2,player.y+player.h/2);if(lives<=0)endGame();break}}}
function updateHearts(){document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives)}
function background(){const palettes=[['#ffd7e5','#fff4fa'],['#d9c9ef','#f3eaff'],['#9cc9ee','#edf8ff'],['#e67da5','#9b77b7'],['#111','#555']];const colors=palettes[stage-1]||palettes[4];const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,colors[0]);grad.addColorStop(1,colors[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<7;i++){const cx=((i*230-frame*.15)%(W+300))-150,cy=70+(i%3)*70;ctx.beginPath();ctx.arc(cx,cy,45,0,Math.PI*2);ctx.arc(cx+45,cy-15,55,0,Math.PI*2);ctx.arc(cx+95,cy,42,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='rgba(100,70,100,.25)';ctx.lineWidth=3;ctx.setLineDash([12,12]);ctx.lineDashOffset=-frame*speed*.3;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.setLineDash([])}
function explosion(x,y){for(let i=0;i<25;i++)particles.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:45,color:Math.random()>.5?'#ff477e':'#ffd23f'})}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.25*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=p.life/45;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,6,6)}ctx.globalAlpha=1}
function difficulty(){speed=Math.min(START_SPEED+score*.008,MAX_SPEED);const next=Math.min(5,Math.floor(score/300)+1);if(next!==stage){stage=next;showStage('STAGE '+stage+'! 속도 UP!')}}
function showStage(text){document.getElementById('stage').textContent=text;messageTimer=100}
function update(dt){frame+=dt;score+=POINTS_PER_SECOND*dt/60;difficulty();player.update(dt);spawnTimer-=dt;if(spawnTimer<=0){makeObstacle();spawnTimer=Math.max(40,85-score*.03)+Math.random()*25;if(score>1200&&Math.random()<.15)setTimeout(()=>{if(gameRunning)makeObstacle()},250)}for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.x-=speed*dt;if(o.flying){o.wave+=.1*dt;o.y+=Math.sin(o.wave)*.8*dt}if(!o.passed&&o.x+o.w<player.x){o.passed=true}if(o.x+o.w<0)obstacles.splice(i,1)}checkCollision();updateParticles(dt);if(messageTimer>0){messageTimer-=dt;if(messageTimer<=0)document.getElementById('stage').textContent=''}document.getElementById('score').textContent=Math.floor(score)}
function draw(){ctx.clearRect(0,0,W,H);background();drawParticles();for(const o of obstacles)drawObstacle(o);player.draw()}
function loop(time){if(!gameRunning)return;const dt=Math.min((time-lastTime)/16.666,2);lastTime=time;update(dt);draw();if(gameRunning)animationId=requestAnimationFrame(loop)}
function startGame(){if(animationId)cancelAnimationFrame(animationId);gameRunning=true;score=0;lives=3;speed=START_SPEED;stage=1;frame=0;spawnTimer=45;obstacles=[];particles=[];player.x=Math.max(35,W*.12);player.y=ground-player.h;player.vy=0;player.onGround=true;player.invincible=0;updateHearts();document.getElementById('score').textContent='0';document.getElementById('stage').textContent='';document.getElementById('startScreen').style.display='none';document.getElementById('gameOver').style.display='none';lastTime=performance.now();animationId=requestAnimationFrame(loop)}
function endGame(){gameRunning=false;const finalScore=Math.floor(score);let record=false;if(finalScore>bestScore){bestScore=finalScore;record=true;try{localStorage.setItem('cuteGameBest',bestScore)}catch(e){}}document.getElementById('scoreFinal').textContent='최종 점수 : '+finalScore;document.getElementById('newRecord').textContent=record?'🎉 신기록!':'최고 점수 : '+bestScore;document.getElementById('gameOver').style.display='flex'}
function jump(){if(gameRunning)player.jump()}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('restartBtn').addEventListener('click',startGame);
document.getElementById('blogBtn').addEventListener('click',()=>{window.location.href=BLOG_URL});
document.getElementById('stopBtn').addEventListener('click',()=>{gameRunning=false;if(animationId)cancelAnimationFrame(animationId);document.getElementById('gameOver').style.display='none';document.getElementById('startScreen').style.display='flex';draw()});
resize();draw();
</script>
</body>
</html>
